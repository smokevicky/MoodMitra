<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoodMitra — Sign In</title>
<link rel="icon" type="image/x-icon" href="./image/MOODMITRALOGO.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: rgba(255,255,255,0.05);
    --surface2: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.1);
    --border2: rgba(255,255,255,0.18);
    --text: #f0ede8;
    --muted: rgba(240,237,232,0.5);
    --accent: #c8b4ff;
    --accent2: rgba(200,180,255,0.15);
    --error: rgba(255,100,100,0.9);
    --success: #7effa0;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Ambient background orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
    z-index: 0;
  }
  .orb-1 { width: 500px; height: 500px; top: -150px; right: -100px;
    background: radial-gradient(ellipse, rgba(200,180,255,0.12) 0%, transparent 70%); }
  .orb-2 { width: 400px; height: 400px; bottom: -100px; left: -80px;
    background: radial-gradient(ellipse, rgba(100,80,200,0.1) 0%, transparent 70%); }

  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 420px;
    margin: 24px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 36px;
    backdrop-filter: blur(20px);
    box-shadow: 0 32px 80px rgba(0,0,0,0.5);
    animation: fadeUp 0.6s cubic-bezier(0.4,0,0.2,1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .brand {
    text-align: center;
    margin-bottom: 32px;
  }
  .brand-name {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    background: linear-gradient(135deg, #c8b4ff, #ffd4a8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .brand-sub {
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.04em;
  }

  /* Tabs */
  .tabs {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 28px;
  }
  .tab {
    flex: 1;
    padding: 9px;
    border: none;
    background: none;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.25s;
  }
  .tab.active {
    background: rgba(200,180,255,0.15);
    color: var(--accent);
    border: 1px solid rgba(200,180,255,0.3);
  }

  /* Forms */
  .form { display: none; flex-direction: column; gap: 14px; }
  .form.active { display: flex; animation: fadeUp 0.3s ease both; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }

  input {
    width: 100%;
    padding: 12px 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input::placeholder { color: rgba(240,237,232,0.25); }
  input:focus {
    border-color: rgba(200,180,255,0.5);
    box-shadow: 0 0 0 3px rgba(200,180,255,0.1);
  }

  .submit-btn {
    width: 100%;
    padding: 13px;
    margin-top: 4px;
    background: linear-gradient(135deg, rgba(200,180,255,0.25), rgba(255,212,168,0.15));
    border: 1px solid rgba(200,180,255,0.4);
    border-radius: 12px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
    letter-spacing: 0.03em;
  }
  .submit-btn:hover { background: linear-gradient(135deg, rgba(200,180,255,0.35), rgba(255,212,168,0.25)); transform: translateY(-1px); }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .msg {
    text-align: center;
    font-size: 0.82rem;
    padding: 10px 14px;
    border-radius: 8px;
    display: none;
  }
  .msg.error   { background: rgba(255,80,80,0.1); border: 1px solid rgba(255,80,80,0.3); color: #ff9999; }
  .msg.success { background: rgba(127,255,160,0.1); border: 1px solid rgba(127,255,160,0.3); color: var(--success); }
  .msg.visible { display: block; }

  .divider {
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
    margin: 4px 0;
    position: relative;
  }

  .back-link {
    text-align: center;
    margin-top: 20px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .back-link a { color: var(--accent); text-decoration: none; }
  .back-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="card">
  <div class="brand">
    <div class="brand-name">MoodMitra</div>
    <div class="brand-sub">Your mental wellness companion</div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
    <button class="tab" id="tabSignup" onclick="switchTab('signup')">Create Account</button>
  </div>

  <!-- Message box -->
  <div class="msg" id="msgBox"></div>

  <!-- Login Form -->
  <form class="form active" id="loginForm" onsubmit="handleLogin(event)">
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
    </div>
    <button class="submit-btn" type="submit" id="loginBtn">Sign In →</button>
  </form>

  <!-- Signup Form -->
  <form class="form" id="signupForm" onsubmit="handleSignup(event)">
    <div class="field">
      <label>Your Name</label>
      <input type="text" id="signupName" placeholder="Arpita" required autocomplete="name">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="signupEmail" placeholder="you@example.com" required autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="signupPassword" placeholder="Min. 6 characters" required minlength="6" autocomplete="new-password">
    </div>
    <button class="submit-btn" type="submit" id="signupBtn">Create Account →</button>
  </form>

  <div class="back-link">
    <a href="index.html">← Back to home</a>
  </div>
</div>

<script>
  // ─── Check if already logged in ────────────────────────────────────────────
  (async () => {
    const res  = await fetch('/me');
    const data = await res.json();
    if (data.user) window.location.href = 'index.html';
  })();

  // ─── Tab switching ──────────────────────────────────────────────────────────
  function switchTab(tab) {
    document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
    document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
    document.getElementById('loginForm').classList.toggle('active', tab === 'login');
    document.getElementById('signupForm').classList.toggle('active', tab === 'signup');
    hideMsg();
  }

  // ─── Message helpers ────────────────────────────────────────────────────────
  function showMsg(text, type) {
    const box = document.getElementById('msgBox');
    box.textContent = text;
    box.className = `msg ${type} visible`;
    box.style.marginBottom = '20px';
  }
  function hideMsg() {
    document.getElementById('msgBox').className = 'msg';
  }

  // ─── Login ──────────────────────────────────────────────────────────────────
  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Signing in…';
    hideMsg();

    try {
      const res  = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email:    document.getElementById('loginEmail').value.trim(),
          password: document.getElementById('loginPassword').value
        })
      });
      const data = await res.json();
      if (!res.ok) { showMsg(data.error, 'error'); return; }
      showMsg(`Welcome back, ${data.name}!`, 'success');
      setTimeout(() => window.location.href = 'index.html', 1000);
    } catch {
      showMsg('Could not connect to server.', 'error');
    } finally {
      btn.disabled = false; btn.textContent = 'Sign In →';
    }
  }

  // ─── Signup ─────────────────────────────────────────────────────────────────
  async function handleSignup(e) {
    e.preventDefault();
    const btn = document.getElementById('signupBtn');
    btn.disabled = true; btn.textContent = 'Creating account…';
    hideMsg();

    try {
      const res  = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name:     document.getElementById('signupName').value.trim(),
          email:    document.getElementById('signupEmail').value.trim(),
          password: document.getElementById('signupPassword').value
        })
      });
      const data = await res.json();
      if (!res.ok) { showMsg(data.error, 'error'); return; }
      showMsg(`Account created! Welcome, ${data.name}!`, 'success');
      setTimeout(() => window.location.href = 'index.html', 1000);
    } catch {
      showMsg('Could not connect to server.', 'error');
    } finally {
      btn.disabled = false; btn.textContent = 'Create Account →';
    }
  }
</script>
</body>
</html>
