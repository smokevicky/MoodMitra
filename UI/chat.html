<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-alt: #1c2128;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #7c6dde;
    --accent-light: #312d6e;
    --accent-text: #c9b8ff;
    --bubble-ai: #1c2128;
    --bubble-user: #7c6dde;
    --pill-bg: #21262d;
    --pill-text: #c9b8ff;
    --pill-border: #4a3fad;
    --status-bg: #0d4429;
    --status-text: #7ee8a2;
    --scrollbar: #30363d;
    --shadow: rgba(0,0,0,0.4);
  }

  body.light {
    --bg: #f0f4f8;
    --surface: #ffffff;
    --surface-alt: #f7f9fc;
    --border: #e2e8f0;
    --text: #1a202c;
    --text-muted: #718096;
    --accent: #6c5fd5;
    --accent-light: #ede9ff;
    --accent-text: #4c3d9e;
    --bubble-ai: #ffffff;
    --bubble-user: #7c6dde;
    --pill-bg: #eef2ff;
    --pill-text: #4c3d9e;
    --pill-border: #c4b5fd;
    --status-bg: #dcfce7;
    --status-text: #166534;
    --scrollbar: #cbd5e0;
    --shadow: rgba(0,0,0,0.08);
  }

  html, body { height: 100%; }

  body {
    font-family: 'Lora', Georgia, serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    transition: background 0.3s, color 0.3s;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    box-shadow: 0 1px 8px var(--shadow);
    z-index: 100;
  }

  .logo { display: flex; align-items: center; gap: 10px; }

  .logo-icon {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #7c6dde, #a78bfa);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
    box-shadow: 0 2px 12px rgba(124,109,222,0.4);
  }

  .logo-name {
    font-size: 18px; font-weight: 600; letter-spacing: -0.3px;
    color: var(--text);
  }

  .logo-sub {
    font-size: 11px; color: var(--text-muted);
    font-family: 'DM Sans', sans-serif; margin-top: 1px;
  }

  .header-right { display: flex; align-items: center; gap: 10px; }

  .status-badge {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600;
    color: var(--status-text);
    background: var(--status-bg);
    padding: 4px 12px; border-radius: 20px;
    font-family: 'DM Sans', sans-serif;
  }

  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
  }

  .theme-btn {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 16px;
    cursor: pointer;
    color: var(--text);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    display: flex; align-items: center; gap: 6px;
    transition: background 0.2s, border-color 0.2s;
  }

  .theme-btn:hover { background: var(--accent-light); border-color: var(--accent); }

  /* ── CHAT AREA ── */
  #chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1rem;
  }

  .chat-inner {
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ── MESSAGES ── */
  .msg-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    animation: fadeSlide 0.35s ease;
  }

  .msg-row.user { flex-direction: row-reverse; }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #7c6dde, #a78bfa);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; margin-top: 3px;
    box-shadow: 0 2px 8px rgba(124,109,222,0.3);
  }

  .bubble {
    max-width: 78%;
    padding: 13px 17px;
    font-size: 15px;
    line-height: 1.75;
    border-radius: 18px 18px 18px 4px;
    background: var(--bubble-ai);
    border: 1px solid var(--border);
    color: var(--text);
    transition: background 0.3s, border-color 0.3s;
  }

  .msg-row.user .bubble {
    background: var(--bubble-user);
    color: #fff;
    border: none;
    border-radius: 18px 18px 4px 18px;
  }

  .response-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--accent-text);
    margin-bottom: 9px;
    font-family: 'DM Sans', sans-serif;
  }

  .bubble p { margin: 0 0 0.4em 0; }
  .bubble strong { font-weight: 600; color: inherit; }
  .bubble .tip-line { display: block; margin: 4px 0; }

  /* Typing indicator */
  .typing-row { display: flex; align-items: flex-start; gap: 10px; animation: fadeSlide 0.3s ease; }

  .typing-bubble {
    background: var(--bubble-ai);
    border: 1px solid var(--border);
    border-radius: 18px 18px 18px 4px;
    padding: 14px 18px;
    display: flex; gap: 5px; align-items: center;
  }

  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); opacity: 0.7;
    animation: pulse 1.3s ease-in-out infinite;
  }

  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50%       { transform: scale(1.35); opacity: 1; }
  }

  /* ── QUERY PANEL ── */
  #query-panel {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 14px 1rem 18px;
    flex-shrink: 0;
    box-shadow: 0 -2px 12px var(--shadow);
  }

  .panel-inner { max-width: 700px; margin: 0 auto; }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .panel-label {
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.3px;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
  }

  .show-all-btn {
    background: none; border: none;
    color: var(--accent);
    font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.8px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: opacity 0.2s;
  }

  .show-all-btn:hover { opacity: 0.75; }

  #pills {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    max-height: 110px;
    overflow: hidden;
    transition: max-height 0.4s ease;
  }

  #pills.expanded { max-height: 400px; overflow-y: auto; }

  .pill {
    background: var(--pill-bg);
    color: var(--pill-text);
    border: 1px solid var(--pill-border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    display: inline-flex; align-items: center; gap: 5px;
    white-space: nowrap;
    transition: all 0.18s ease;
    user-select: none;
  }

  .pill:hover:not(:disabled) {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(124,109,222,0.3);
  }

  .pill.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .pill:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

  .pill-icon { font-size: 14px; }

  .panel-footer {
    margin-top: 10px;
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    text-align: center;
  }

  /* Mobile tweaks */
  @media (max-width: 600px) {
    header { padding: 0 1rem; }
    .status-badge { display: none; }
    .logo-sub { display: none; }
    .bubble { max-width: 88%; font-size: 14px; }
    #query-panel { padding: 10px 0.75rem 14px; }
  }
</style>
</head>

// ─── STATE ──────────────────────────────────────────────────────────────
let darkMode = true;
let loading = false;
let showAll = false;

// ─── INIT ────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  renderPills();
  addWelcomeMessage();
});

// ─── THEME ───────────────────────────────────────────────────────────────
function toggleTheme() {
  darkMode = !darkMode;
  document.body.classList.toggle('light', !darkMode);
  document.getElementById('themeBtn').innerHTML = darkMode ? '☀️ Light Mode' : '🌙 Dark Mode';
}

// ─── PILLS ───────────────────────────────────────────────────────────────
function renderPills() {
  const container = document.getElementById('pills');
  const list = showAll ? QUERIES : QUERIES.slice(0, 12);
  container.innerHTML = '';
  container.className = showAll ? 'expanded' : '';

  list.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'pill';
    btn.id = 'pill-' + q.id;
    btn.innerHTML = `<span class="pill-icon">${q.icon}</span>${q.short}`;
    btn.onclick = () => handleQuery(q);
    if (loading) btn.disabled = true;
    container.appendChild(btn);
  });
}

function toggleShowAll() {
  showAll = !showAll;
  document.getElementById('showAllBtn').textContent = showAll
    ? 'Show Less ▲'
    : `Show All (${QUERIES.length}) ▼`;
  renderPills();
}

// ─── MESSAGES ────────────────────────────────────────────────────────────
function addWelcomeMessage() {
  const text = [
    "Hello there! 💙 I'm **Serene**, your mental health companion.",
    "",
    "I'm here to listen, support, and offer guidance — a safe space just for you. Whatever you're feeling right now, you're not alone.",
    "",
    "Please select a topic below that resonates with you, and I'll share some gentle, evidence-based support. Remember, while I can offer helpful guidance, I always encourage speaking with a qualified mental health professional for deeper support. 🌿"
  ];
  appendMessage('ai', text, null);
}

function handleQuery(q) {
  if (loading) return;

  // Highlight active pill
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  const pillEl = document.getElementById('pill-' + q.id);
  if (pillEl) pillEl.classList.add('active');

  // User bubble
  appendMessage('user', [q.label], null);

  // Set loading
  loading = true;
  setAllPillsDisabled(true);
  const typingId = addTypingIndicator();

  // Simulate response delay
  setTimeout(() => {
    removeTypingIndicator(typingId);
    const resp = RESPONSES[q.id];
    appendMessage('ai', resp.message, resp.title);
    loading = false;
    setAllPillsDisabled(false);
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  }, 1100 + Math.random() * 600);
}

function appendMessage(role, lines, title) {
  const chat = document.getElementById('chatInner');

  const row = document.createElement('div');
  row.className = 'msg-row' + (role === 'user' ? ' user' : '');

  if (role === 'ai') {
    const av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = '🌿';
    row.appendChild(av);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (title) {
    const t = document.createElement('div');
    t.className = 'response-title';
    t.textContent = title;
    bubble.appendChild(t);
  }

  const content = document.createElement('div');
  lines.forEach(line => {
    if (line === '') {
      content.appendChild(document.createElement('br'));
      return;
    }
    const span = document.createElement('span');
    span.className = 'tip-line';
    span.innerHTML = formatLine(line);
    content.appendChild(span);
  });

  bubble.appendChild(content);
  row.appendChild(bubble);
  chat.appendChild(row);
  scrollToBottom();
}

function formatLine(text) {
  return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
}

function addTypingIndicator() {
  const chat = document.getElementById('chatInner');
  const id = 'typing-' + Date.now();

  const row = document.createElement('div');
  row.className = 'typing-row';
  row.id = id;

  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = '🌿';

  const bubble = document.createElement('div');
  bubble.className = 'typing-bubble';
  bubble.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';

  row.appendChild(av);
  row.appendChild(bubble);
  chat.appendChild(row);
  scrollToBottom();
  return id;
}

function removeTypingIndicator(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function setAllPillsDisabled(state) {
  document.querySelectorAll('.pill').forEach(p => p.disabled = state);
}

function scrollToBottom() {
  const area = document.getElementById('chat-area');
  setTimeout(() => area.scrollTo({ top: area.scrollHeight, behavior: 'smooth' }), 50);
}
</script>
